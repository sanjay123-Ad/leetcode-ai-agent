name: 🤖 Daily LeetCode AI Solver

on:
  # Run every day at 2:30 AM UTC = 8:00 AM IST
  schedule:
    - cron: '30 2 * * *'
  
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  solve-daily-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install
        working-directory: leetcode-agent

      - name: Run AI LeetCode Solver
        id: solver
        run: node standalone-solver.mjs
        working-directory: leetcode-agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JUDGE0_API_KEY: ${{ secrets.JUDGE0_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "LeetCode AI Agent: ${{ steps.solver.outputs.SOLVE_STATUS }}"
          to: ${{ secrets.MAIL_USERNAME }}
          from: LeetCode AI Agent
          body: |
            Daily LeetCode Problem: ${{ steps.solver.outputs.PROBLEM_TITLE }}
            Result: ${{ steps.solver.outputs.SOLVE_STATUS }}
            
            Check your Supabase dashboard or GitHub repository for details!
            https://github.com/${{ github.repository }}/actions
