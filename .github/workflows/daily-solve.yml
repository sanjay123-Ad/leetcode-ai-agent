name: 🤖 Daily LeetCode AI Solver

on:
  # Run every day at 2:30 AM UTC = 8:00 AM IST
  schedule:
    - cron: '0 7 * * *'
  
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  solve-daily-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install
        working-directory: leetcode-agent

      - name: Run AI LeetCode Solver
        id: solver
        run: node standalone-solver.mjs
        working-directory: leetcode-agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JUDGE0_API_KEY: ${{ secrets.JUDGE0_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ SUCCESS: ${{ steps.solver.outputs.PROBLEM_TITLE }}"
          to: sanjayroyal585858@gmail.com
          from: GitHub Actions Bot
          html_body: file://leetcode-agent/email_success.html

      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ FAILED: LeetCode Daily AI Solver"
          to: sanjayroyal585858@gmail.com
          from: GitHub Actions Bot
          body: "Hello Sanjay,\n\nThe AI Agent failed to solve today's LeetCode problem or encountered an error. ⚠️\n\nPlease check the GitHub Actions logs for more details.\n\nBest,\nYour AI Agent"
