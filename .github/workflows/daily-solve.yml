name: 🤖 Daily LeetCode AI Solver

on:
  # Run every day at 2:30 AM UTC = 8:00 AM IST
  schedule:
    - cron: '30 2 * * *'
  
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  solve-daily-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install
        working-directory: leetcode-agent

      - name: Run AI LeetCode Solver
        run: node standalone-solver.mjs
        working-directory: leetcode-agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JUDGE0_API_KEY: ${{ secrets.JUDGE0_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
